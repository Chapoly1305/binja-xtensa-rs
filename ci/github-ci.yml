name: ci
on: [push, pull_request]
jobs:
  isa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p xtensa-isa --check
      - run: cargo clippy -p xtensa-isa --all-targets -- -D warnings
      - run: cargo test -p xtensa-isa
      - name: golden digests
        run: |
          cargo run -q --profile golden -p xtensa-isa --example golden -- --out out/golden
          cmp out/golden/SHA256SUMS golden/decode_v1.SHA256SUMS
  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 harness/gen_model_rs.py --check
